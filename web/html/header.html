<!-- static/html/header.html -->
<div style="text-align: center; padding: 15px; background: #007bff; color: white; margin-bottom: 20px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
    <h1 style="margin: 0; font-size: 1.8rem;">Шифрование</h1>

    <!-- Кнопки для неавторизованных -->
    <div id="auth-buttons" style="display: flex; gap: 10px;">
        <button onclick="goToHome()" class="auth-btn">Главная</button>
        <button onclick="goToLogin()" class="auth-btn">Войти</button>
        <button onclick="goToRegister()" class="auth-btn">Регистрация</button>
    </div>

    <!-- Для авторизованных пользователей -->
    <div id="user-info" style="display: none; gap: 10px; align-items: center;">
        <button onclick="goToHome()" style="background: white; color: #007bff; border: 1px solid white; padding: 8px 14px; border-radius: 4px; cursor: pointer; font-weight: bold;">
            Главная
        </button>
        <button onclick="goToAdmin()" id="admin-panel-btn" style="background: #ffc107; color: #212529; border: none; padding: 8px 14px; border-radius: 4px; cursor: pointer; font-weight: bold;">
            Админ-панель
        </button>
        <button onclick="logout()" style="background: #dc3545; color: white; border: none; padding: 8px 14px; border-radius: 4px; cursor: pointer;">
            Выйти
        </button>
    </div>
</div>

<style>
    .auth-btn {
        padding: 8px 14px;
        background: white;
        color: #007bff;
        border: 1px solid white;
        border-radius: 4px;
        cursor: pointer;
        font-size: 14px;
    }
    .auth-btn:hover { background: #f0f0f0; }
</style>
